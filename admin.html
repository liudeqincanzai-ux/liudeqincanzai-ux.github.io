<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统一后台 · Toneby</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/admin.v28.css">
  <link rel="stylesheet" href="assets/admin.v46.css">
</head>
<body>
  <div id="errBanner"></div>
  <!-- 密码门 -->
  <div id="gate" class="gate">
    <div class="gate-box">
      <h1>统一后台</h1>
      <p class="gate-hint">官网编辑 + LUT 展示编辑</p>
      <input id="gatePass" type="password" autocomplete="current-password" placeholder="管理密码">
      <button id="gateBtn" type="button">进入</button>
      <p id="gateErr" class="gate-err"></p>
      <a class="bar-link" href="index.html">← 返回官网</a>
    </div>
  </div>

  <div id="app" style="display:none">
    <header class="edit-bar">
      <span class="bar-title">统一后台</span>
      <span class="bar-actions">
        <span id="syncStatus" class="sync-status"></span>
        <button id="btnWeb" type="button" class="tab active">官网编辑</button>
        <button id="btnLut" type="button" class="tab">LUT 展示编辑</button>
        <button id="btnSync" type="button" class="primary">保存并同步官网</button>
      </span>
    </header>

    <!-- 官网编辑：左侧板块列表 + 中间预览 + 右侧编辑抽屉 -->
    <div id="webPane" class="edit-shell" style="display:none">
      <aside class="side">
        <div class="side-title">页面板块</div>
        <ul id="secList" class="sec-list"></ul>
        <button id="addSec" type="button" class="add-sec">＋ 添加板块</button>
        <div id="addMenu" class="add-menu" style="display:none"></div>
        <div class="side-foot">
          <button id="btnSettings" type="button" class="side-item">⚙ 站点与法务设置</button>
        </div>
      </aside>
      <main class="pv-area">
        <div class="pv-toolbar">
          <span class="pv-hint">点击预览中的板块即可编辑 · 预览内点击不会跳转</span>
          <span class="dev-toggle">
            <button id="devDesktop" type="button" class="dev-btn active">电脑端</button>
            <button id="devMobile" type="button" class="dev-btn">手机端</button>
          </span>
        </div>
        <div class="pv-center" id="pvCenter" data-mode="desktop">
          <div class="pv-frame" id="pvFrameBox">
            <iframe id="previewFrame" src="/" title="前台预览"></iframe>
          </div>
        </div>
      </main>
      <aside class="drawer" id="drawer">
        <div class="drawer-head">
          <span id="drawerTitle">编辑板块</span>
          <button id="drawerClose" type="button" aria-label="关闭">×</button>
        </div>
        <div class="drawer-body" id="drawerBody"></div>
      </aside>
    </div>

    <!-- LUT 展示编辑（iframe 内嵌现有编辑器） -->
    <div id="lutPane" style="display:none;flex:1;min-height:0">
      <iframe id="lutFrame" src="https://liudeqincanzai-ux.github.io/toneby-lut-showcase/edit.html"
              style="width:100%;height:100%;border:0"></iframe>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script>
  /* 内联引导：已解锁时刷新页面立即显示编辑界面（不依赖外部 JS 的加载与执行时序） */
  (function () {
    function __admShow() {
      var a = document.getElementById("app");
      var w = document.getElementById("webPane");
      if (a) { a.style.display = "flex"; a.style.flexDirection = "column"; }
      if (w) w.style.display = "flex";
    }
    window.__admShow = __admShow;
    try { if (sessionStorage.getItem("lut_admin_unlocked") === "1") __admShow(); } catch (e) {}
  })();
  </script>
  <script src="data.js?v=54"></script>
  <script src="assets/admin.v53.js?v=61"></script>
</body>
</html>

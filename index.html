<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="assets/favicon.jpg">
  <title>Toneby</title>
  <meta name="description" content="Toneby combines reference-image color matching, authentic 3D LUTs and a real-time LUT camera with 100% on-device processing. No uploads. No accounts.">
  <link rel="stylesheet" href="assets/style.v57.css?v=60">
</head>
<body>

<header class="wrap nav" data-sec="hero">
  <a class="brand" href="./" id="navBrand"></a>
  <nav class="nav-links mono" id="navLinks"></nav>
</header>

<!-- ============ HERO ============ -->
<section class="wrap hero" id="hero" data-sec="hero">
  <div class="hero-grid">
    <div class="hero-mast">
      <div class="mast-eyebrow" id="heroEyebrow"></div>
      <div class="mast-big" id="heroBig"></div>
      <div class="mast-sub" id="heroSub"></div>
    </div>

    <div class="hero-left">
      <hr class="rule">
      <p id="heroIntro"></p>
      <div class="store-btns" id="heroBtns"></div>
    </div>

    <div class="hero-center">
      <div class="deck" id="deck">
        <div class="card c-hidden" id="cardHidden"><img src="" alt=""></div>
        <div class="card c-left" id="cardLeft"><img src="" alt=""></div>
        <div class="card c-right" id="cardRight"><img src="" alt=""></div>
        <div class="card c-front" id="cardFront"><img src="" alt=""></div>
        <button class="shot-arrow prev" id="prevBtn" aria-label="Previous screenshot">‹</button>
        <button class="shot-arrow next" id="nextBtn" aria-label="Next screenshot">›</button>
      </div>
      <div class="shot-cap" id="shotCaption" style="grid-column:2"></div>
    </div>

    <div class="hero-right" id="heroGroups"></div>
  </div>
</section>

<!-- ============ NUMBERS ============ -->
<section class="numbers" id="numbers" data-sec="numbers">
  <div class="wrap" style="display:contents" id="numbersGrid"></div>
</section>

<!-- ============ FEATURES INTRO ============ -->
<section class="wrap features-intro" id="features" data-sec="features">
  <div class="tag" id="featTag"></div>
  <h2 id="featTitle"></h2>
  <p id="featDesc"></p>
</section>

<!-- ============ MODULES ============ -->
<section class="wrap modules" id="modules" data-sec="modules">
  <div class="mods-wrap">
    <div class="mods-sticky"><div class="mods-frame" id="modsFrame"></div></div>
    <div class="mods-texts" id="modsTexts"></div>
  </div>
</section>

<!-- ============ LUT GALLERY（LUT 展示整合进本页） ============ -->
<section class="gallery-page" id="gallery" data-sec="gallery">
  <div class="wrap">
    <div class="gp-head">
      <h2 id="galleryTitle"></h2>
      <div class="picker-wrap">
        <select id="galleryPicker" aria-label="选择 LUT 分组"></select>
        <span class="picker-arrow">▾</span>
      </div>
    </div>
    <p class="gp-desc" id="galleryDesc"></p>
    <main id="galleryPosts"></main>
  </div>
</section>

<!-- ============ JOURNAL ============ -->
<section class="journal" id="journal" data-sec="journal">
  <div class="wrap journal-grid">
    <div class="journal-left">
      <div class="journal-eyebrow" id="journalEyebrow"></div>
      <h2 class="journal-big" id="journalTitle"></h2>
      <p class="journal-desc" id="journalDesc"></p>
    </div>
    <div id="journalList"></div>
  </div>
</section>

<!-- ============ FAQ ============ -->
<section class="faq" id="faq" data-sec="faq">
  <div class="wrap faq-grid">
    <div class="faq-left">
      <div class="faq-eyebrow" id="faqEyebrow"></div>
      <h2 class="faq-big" id="faqTitle"></h2>
      <p class="faq-desc" id="faqDesc"></p>
    </div>
    <div id="faqList"></div>
  </div>
</section>

<!-- ============ CTA ============ -->
<section class="cta" id="download" data-sec="cta">
  <div class="wrap">
    <h2 id="ctaTitle"></h2>
    <div class="store-btns" id="ctaBtns"></div>
  </div>
</section>

<footer>
  <div class="wrap foot">
    <span class="fbrand" id="footBrand"></span>
    <nav class="foot-links" id="footLinks"></nav>
    <span class="copy" id="footCopy"></span>
  </div>
</footer>

<script>
(function () {
  var V = "v=73";
  function tryLoad(src, check, next, tries) {
    var s = document.createElement("script");
    s.src = src;
    function retry() { if (tries > 0) setTimeout(function () { tryLoad(src + "&r=" + (5 - tries), check, next, tries - 1); }, 700); }
    s.onload = function () { if (check()) next(); else retry(); };
    s.onerror = retry;
    document.head.appendChild(s);
  }
  tryLoad("data.js?" + V + "&ts=" + Date.now(), function () { return typeof SITE_WEB !== "undefined"; }, function () {
    tryLoad("assets/site.v63.js?ts=" + Date.now(), function () { return !!window.__SITE_BOOTED; }, function () {}, 3);
  }, 3);
})();
</script>
</body>
</html>
